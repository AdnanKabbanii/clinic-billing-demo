name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request on a multi-tenant billing service that moves real money.
            The PR branch is checked out in the working directory.

            1. Read REVIEW.md and CLAUDE.md first. REVIEW.md is the checklist.
            2. Read the diff with `gh pr diff`, then read the surrounding files you need to understand it.
            3. For every finding, post an inline comment on the exact line with
               `mcp__github_inline_comment__create_inline_comment` (confirmed: true). Each comment states:
               the REVIEW.md item it violates, a concrete failure scenario (inputs -> wrong outcome), and the fix.
            4. Do not comment on style or naming. Only correctness, security, tenant isolation, money and missing tests.
            5. Finish with one `gh pr comment` summary: a table of findings marked BLOCKING or NON-BLOCKING,
               and a verdict line: "Verdict: request changes" or "Verdict: approve".
            Only post GitHub comments. Do not reply with review text as a message.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
